<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transparent to Black Converter</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background: #1c1c1c;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    input {
      margin: 16px 0;
    }

    canvas {
      max-width: 100%;
      border: 1px solid #333;
      border-radius: 12px;
      background: white;
      margin-top: 20px;
    }

    button {
      background: #ffffff;
      color: #111;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin: 10px;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Image → Black Silhouette</h1>
    <p>Every non-transparent pixel becomes pure black. Transparent pixels stay transparent.</p>

    <input type="file" id="upload" accept="image/png,image/webp,image/svg+xml,image/jpeg" />
    <br />
    <button id="downloadBtn" style="display:none;">Download Result</button>

    <br />
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');

    upload.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(e) {
        const img = new Image();

        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imageData.data;

          for (let i = 0; i < data.length; i += 4) {
            const alpha = data[i + 3];

            if (alpha > 0) {
              data[i] = 0;     // R
              data[i + 1] = 0; // G
              data[i + 2] = 0; // B
            }
          }

          ctx.putImageData(imageData, 0, 0);
          downloadBtn.style.display = 'inline-block';
        };

        img.src = e.target.result;
      };

      reader.readAsDataURL(file);
    });

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'black-silhouette.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
